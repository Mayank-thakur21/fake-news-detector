# Full stack: FastAPI backend + Streamlit frontend.
#   cp .env.example .env    # then set API_KEYS / API_KEY
#   docker compose up --build
# UI:  http://localhost:8501     API docs: http://localhost:8000/docs
name: fake-news-detector

services:
  backend:
    build:
      context: .
      target: backend
    image: fake-news-detector-api:latest
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_DIR: /app/models
      DB_PATH: /app/storage/predictions.db
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models
      - storage:/app/storage
      # Drop Kaggle's Fake.csv / True.csv into ./data to train on the full dataset.
      - ./data:/app/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    image: fake-news-detector-ui:latest
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  storage:
